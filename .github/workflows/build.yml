name: Build iOS Simulator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer SwiftWasm
        uses: swiftwasm/setup-swiftwasm@v2

      - name: Installer carton
        run: |
          git clone --depth 1 https://github.com/swiftwasm/carton.git /tmp/carton
          cd /tmp/carton
          swift build -c release
          sudo cp .build/release/carton /usr/local/bin/carton

      - name: Build avec carton
        run: carton bundle --custom-index-page index.html

      - name: Préparer le site
        run: |
          cp -r images Bundle/ || true
          cp style.css index.js Bundle/ || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Bundle

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
