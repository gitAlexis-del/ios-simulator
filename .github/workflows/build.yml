name: Build iOS Simulator
on:
  push:
    branches: [main]

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build avec carton
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            ghcr.io/swiftwasm/carton:latest \
            bundle --custom-index-page index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Bundle
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
