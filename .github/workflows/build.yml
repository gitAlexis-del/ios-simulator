name: Build iOS Simulator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: swift:6.3.2
    steps:
      - uses: actions/checkout@v4

      - name: Installer le SDK WebAssembly
        id: sdk
        uses: swiftwasm/setup-swiftwasm@v2
        with:
          tag: "swift-6.3.2-RELEASE"
          target: "wasm32-unknown-wasip1"

      - name: Compiler le Swift en WebAssembly
        run: swift package --swift-sdk "${{ steps.sdk.outputs.swift-sdk-id }}" js --product iOSApp

      - name: Préparer le site
        run: |
          mkdir -p site
          cp -r .build/plugins/PackageToJS/outputs/Package/* site/
          cp index.html style.css shell.js site/
          cp -r images site/ || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
